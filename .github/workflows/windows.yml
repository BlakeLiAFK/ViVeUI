name: Windows build, tests and packages
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test catalog, transactions, scoped undo and update trust
        run: dotnet run --project src/ViVeUI.Tests -c Release
      - name: Build native WPF application
        run: dotnet build src/ViVeUI.Windows -c Release
      - name: Render and exercise WPF with fake backend only
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'src/ViVeUI.Windows/bin/Release/net8.0-windows/ViVeUI.exe' -ArgumentList '--smoke' -PassThru
          if (-not $p.WaitForExit(90000)) { $p.Kill(); throw 'UI smoke test timed out' }
          if ($p.ExitCode -ne 0) { Get-Content smoke-error.txt -ErrorAction SilentlyContinue; throw 'UI smoke test failed' }
          Get-Content smoke-result.txt
      - name: Package self-contained x64 and ARM64 builds with corresponding source
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force .artifacts | Out-Null
          git archive --format=zip --output=.artifacts/ViVeUI-source.zip HEAD
          foreach ($arch in @('x64', 'arm64')) {
            dotnet publish src/ViVeUI.Windows -c Release -r win-$arch --self-contained true -p:PublishSingleFile=false -o .artifacts/win-$arch
            if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
            # Preserve redistribution notices from the exact resolved .NET runtime packs.
            $packPaths = @(Get-Content src/ViVeUI.Windows/obj/runtime-pack-paths.txt | Where-Object { $_ } | Sort-Object -Unique)
            if ($packPaths.Count -lt 2) { throw 'Both .NET Core and Windows Desktop runtime notices are required' }
            $licenseDir = ".artifacts/win-$arch/runtime-notices"
            New-Item -ItemType Directory -Force $licenseDir | Out-Null
            foreach ($packPath in $packPaths) {
              if (-not (Test-Path $packPath)) { throw "Missing resolved runtime pack: $packPath" }
              $packName = Split-Path (Split-Path $packPath -Parent) -Leaf
              $notices = @(Get-ChildItem $packPath -File | Where-Object { $_.Name -match 'LICENSE|THIRD.?PARTY.?NOTICES' })
              if ($notices.Count -lt 1) { throw "Missing runtime notices: $packName" }
              foreach ($notice in $notices) { Copy-Item $notice.FullName (Join-Path $licenseDir ($packName + '-' + $notice.Name)) }
            }
            Copy-Item .artifacts/ViVeUI-source.zip .artifacts/win-$arch/
            Copy-Item README.md .artifacts/win-$arch/
            @{ commit = $env:GITHUB_SHA; architecture = $arch; workflow = "https://github.com/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID" } | ConvertTo-Json | Set-Content .artifacts/win-$arch/BUILD.json
            Copy-Item -Recurse docs .artifacts/win-$arch/
            Compress-Archive -Path .artifacts/win-$arch/* -DestinationPath .artifacts/ViVeUI-win-$arch.zip
          }
          Get-FileHash .artifacts/ViVeUI-*.zip -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $([IO.Path]::GetFileName($_.Path))" } | Set-Content .artifacts/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ViVeUI-previews-and-test-evidence
          path: |
            previews/*.png
            smoke-result.txt
            smoke-error.txt
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ViVeUI-Windows-packages
          include-hidden-files: true
          path: |
            .artifacts/*.zip
            .artifacts/SHA256SUMS.txt
          if-no-files-found: error
